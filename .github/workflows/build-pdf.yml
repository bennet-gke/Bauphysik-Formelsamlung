name: Build PDF

on:
  push:
    branches:
      - main
    paths:
      - 'Bauphysik_Formelsammlung.tex'

jobs:
  build:
    runs-on: ubuntu-latest
    if: "! contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: LaTeX-Dokument kompilieren
        uses: xu-cheng/texlive-action@v4
        with:
          # Vollständige TeX Live Installation (alle Pakete)
          scheme: full
          # Optional: Version festlegen, z.B. 2024, sonst neueste
          # texlive_version: 2024
          commands: |
            latexmk -pdf -interaction=nonstopmode Bauphysik_Formelsammlung.tex

      - name: PDF committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Bauphysik_Formelsammlung.pdf
          if git diff --staged --quiet; then
            echo "Keine Änderungen an der PDF – nichts zu committen."
          else
            git commit -m "PDF automatisch aktualisiert [skip ci]"
            git push
          fi
