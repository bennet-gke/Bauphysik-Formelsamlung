name: Build PDF

on:
  push:
    branches:
      - main
    paths:
      - 'Bauphysik_Formelsammlung.tex'

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker.io/texlive/texlive:latest
    if: "! contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: latexmk installieren
        run: |
          tlmgr install latexmk

      - name: LaTeX-Dokument kompilieren
        run: |
          latexmk -pdf -interaction=nonstopmode Bauphysik_Formelsammlung.tex

      - name: Git installieren
        run: |
          apt-get update && apt-get install -y git

      - name: PDF committen und pushen
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Bauphysik_Formelsammlung.pdf
          if git diff --staged --quiet; then
            echo "Keine Änderungen an der PDF – nichts zu committen."
          else
            git commit -m "PDF automatisch aktualisiert [skip ci]"
            git push
          fi
